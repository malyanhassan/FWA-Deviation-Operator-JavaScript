<!DOCTYPE html>
<html>
<head>
    <title>FWA Deviation Operator — JavaScript</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>FWA Deviation Operator — Basic Simulation</h2>

<canvas id="deviationChart"></canvas>

<script>
function delta(x, gamma = 0.12, psi = 0.03) {
    return x - gamma * x + psi;
}

const steps = 120;
let x = 1.0;
let trajectory = [];

for (let i = 0; i < steps; i++) {
    x = delta(x);
    trajectory.push(x);
}

const labels = trajectory.map((_, i) => i + 1);

new Chart(document.getElementById("deviationChart"), {
    type: "line",
    data: {
        labels: labels,
        datasets: [{
            label: "Δ dynamics",
            data: trajectory,
            borderWidth: 2,
            fill: false
        }]
    },
    options: {
        responsive: true,
        scales: {
            x: {
                title: {
                    display: true,
                    text: "Step"
                }
            },
            y: {
                title: {
                    display: true,
                    text: "Value"
                }
            }
        }
    }
});
</script>

</body>
</html>
